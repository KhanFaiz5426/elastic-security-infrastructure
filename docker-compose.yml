services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: ecp-elasticsearch-security-setup
    volumes:
      - certs:/usr/share/elasticsearch/config/certs:z
      - fleet-certs:/usr/share/elasticsearch/config/fleet-certs
      - kibana-certs:/usr/share/elasticsearch/config/kibana-certs
    user: "0"
    environment:
      # Secrets and addresses are passed via the container environment (never
      # interpolated into the command string) so they do not appear in the
      # process command line (/proc/<pid>/cmdline) or in `docker inspect`
      # .Config.Cmd.
      - ELASTIC_USERNAME=${ELASTIC_USERNAME:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_USERNAME=${KIBANA_USERNAME:-kibana_system}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
      - SIEM_IP=${SIEM_IP}
      - SIEM_NAT_IP=${SIEM_NAT_IP:-}
    command: >
      bash -c '
        if [ x$${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x$${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip -o config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          printf "%b" \
          "instances:\n"\
          "  - name: elasticsearch\n"\
          "    dns:\n"\
          "      - ecp-elasticsearch\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - $${SIEM_IP}\n"\
          "$${SIEM_NAT_IP:+      - $${SIEM_NAT_IP}\n}"\
          "  - name: kibana\n"\
          "    dns:\n"\
          "      - ecp-kibana\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - $${SIEM_IP}\n"\
          "$${SIEM_NAT_IP:+      - $${SIEM_NAT_IP}\n}"\
          "  - name: fleet-server\n"\
          "    dns:\n"\
          "      - ecp-fleet-server\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - $${SIEM_IP}\n"\
          "$${SIEM_NAT_IP:+      - $${SIEM_NAT_IP}\n}"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip -o config/certs/certs.zip -d config/certs;
          cat config/certs/elasticsearch/elasticsearch.crt config/certs/ca/ca.crt > config/certs/elasticsearch/elasticsearch.chain.pem
        fi;
        echo "Preparing isolated Fleet Server certificate directory";
        mkdir -p config/fleet-certs/ca;
        mkdir -p config/fleet-certs/fleet-server;
        cp config/certs/ca/ca.crt config/fleet-certs/ca/ca.crt;
        cp config/certs/fleet-server/fleet-server.crt config/fleet-certs/fleet-server/fleet-server.crt;
        cp config/certs/fleet-server/fleet-server.key config/fleet-certs/fleet-server/fleet-server.key;
        echo "Preparing isolated Kibana certificate directory";
        mkdir -p config/kibana-certs/ca;
        mkdir -p config/kibana-certs/kibana;
        cp config/certs/ca/ca.crt config/kibana-certs/ca/ca.crt;
        cp config/certs/kibana/kibana.crt config/kibana-certs/kibana/kibana.crt;
        cp config/certs/kibana/kibana.key config/kibana-certs/kibana/kibana.key;
        echo "Setting file permissions";
        chown -R root:root config/certs;
        chown -R root:root config/fleet-certs;
        chown -R root:root config/kibana-certs;
        find . -type d -exec chmod 750 \{\} \;;
        find . -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://ecp-elasticsearch:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        ADMIN_USER="";
        ADMIN_PASS="";
        if [ "$${ELASTIC_USERNAME:-elastic}" != "elastic" ]; then
          echo "Checking whether custom superuser $${ELASTIC_USERNAME} already exists";
          if curl -s --cacert config/certs/ca/ca.crt -u $${ELASTIC_USERNAME}:$${ELASTIC_PASSWORD} https://ecp-elasticsearch:9200/_security/_authenticate | grep -q username; then
            ADMIN_USER="$${ELASTIC_USERNAME}";
            ADMIN_PASS="$${ELASTIC_PASSWORD}";
          fi;
        fi;
        if [ -z "$${ADMIN_USER}" ]; then
          echo "Bootstrapping security with the built-in elastic account";
          if curl -s --cacert config/certs/ca/ca.crt -u elastic:$${ELASTIC_PASSWORD} https://ecp-elasticsearch:9200/_security/_authenticate | grep -q username; then
            ADMIN_USER="elastic";
            ADMIN_PASS="$${ELASTIC_PASSWORD}";
          fi;
        fi;
        if [ -z "$${ADMIN_USER}" ]; then
          echo "Trying previously stored bootstrap credentials";
          if [ -f config/certs/.admin_creds ]; then
            OLD_USER=$(sed -n 1p config/certs/.admin_creds);
            OLD_PASS=$(sed -n 2p config/certs/.admin_creds);
            if curl -s --cacert config/certs/ca/ca.crt -u "$${OLD_USER}:$${OLD_PASS}" https://ecp-elasticsearch:9200/_security/_authenticate | grep -q username; then
              ADMIN_USER="$${OLD_USER}";
              ADMIN_PASS="$${OLD_PASS}";
              echo "Using previously stored admin $${OLD_USER} for bootstrap.";
            fi;
          fi;
        fi;
        if [ -z "$${ADMIN_USER}" ]; then
          echo "ERROR: no usable admin account found.";
          echo "Re-run with an existing admin in .env, or run elastic-container.sh destroy for a fresh build.";
          exit 1;
        fi;
        echo "Using $${ADMIN_USER} as the admin account.";
        if [ "$${ELASTIC_USERNAME:-elastic}" != "elastic" ]; then
          echo "Creating custom superuser $${ELASTIC_USERNAME}";
          until curl -s -X PUT --cacert config/certs/ca/ca.crt -u $${ADMIN_USER}:$${ADMIN_PASS} -H "Content-Type: application/json" https://ecp-elasticsearch:9200/_security/user/$${ELASTIC_USERNAME} -d "{\"password\":\"$${ELASTIC_PASSWORD}\",\"roles\":[\"superuser\"]}" | grep -q "created\|^{}"; do sleep 10; done;
          ADMIN_USER="$${ELASTIC_USERNAME}";
          ADMIN_PASS="$${ELASTIC_PASSWORD}";
          echo "Verifying custom superuser $${ELASTIC_USERNAME} can authenticate";
          until curl -s --cacert config/certs/ca/ca.crt -u $${ADMIN_USER}:$${ADMIN_PASS} https://ecp-elasticsearch:9200/_security/_authenticate | grep -q username; do sleep 10; done;
          echo "Disabling the built-in elastic account (use $${ELASTIC_USERNAME} to log in).";
          until curl -s -X POST --cacert config/certs/ca/ca.crt -u $${ADMIN_USER}:$${ADMIN_PASS} -H "Content-Type: application/json" https://ecp-elasticsearch:9200/_security/user/elastic/_disable | grep -q "^{}"; do sleep 10; done;
        fi;
        if [ "$${KIBANA_USERNAME:-kibana_system}" != "kibana_system" ]; then
          echo "Creating custom Kibana user $${KIBANA_USERNAME}";
          until curl -s -X PUT --cacert config/certs/ca/ca.crt -u $${ADMIN_USER}:$${ADMIN_PASS} -H "Content-Type: application/json" https://ecp-elasticsearch:9200/_security/user/$${KIBANA_USERNAME} -d "{\"password\":\"$${KIBANA_PASSWORD}\",\"roles\":[\"kibana_system\"]}" | grep -q "created\|^{}"; do sleep 10; done;
        else
          echo "Setting kibana_system password";
          until curl -s -X POST --cacert config/certs/ca/ca.crt -u $${ADMIN_USER}:$${ADMIN_PASS} -H "Content-Type: application/json" https://ecp-elasticsearch:9200/_security/user/kibana_system/_password -d "{\"password\":\"$${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        fi;
        echo "Storing admin credentials for future bootstrap.";
        printf "%s\n%s" "$${ELASTIC_USERNAME:-elastic}" "$${ELASTIC_PASSWORD}" > config/certs/.admin_creds;
        chmod 600 config/certs/.admin_creds;
        echo "Preparing Fleet Server service token";
        TOKEN_FILE=config/fleet-certs/service-token;
        if [ -f "$${TOKEN_FILE}" ] && [ -s "$${TOKEN_FILE}" ]; then
          echo "Fleet Server service token file already present. Reusing existing token.";
        else
          SERVICE_TOKEN_RESPONSE=$(curl -s -o /tmp/service-token-resp.json -w "%{http_code}" -X POST --cacert config/certs/ca/ca.crt -u "$${ADMIN_USER}:$${ADMIN_PASS}" -H "Content-Type: application/json" "https://ecp-elasticsearch:9200/_security/service/elastic/fleet-server/credential/token/fleet-server-token");
          SERVICE_TOKEN_CODE="$${SERVICE_TOKEN_RESPONSE}";
          if [ "$${SERVICE_TOKEN_CODE}" = "200" ]; then
            SERVICE_TOKEN_VALUE=$(sed -n "s/.*\"token\":{[^}]*\"value\":\"\([^\"]*\)\".*/\1/p" /tmp/service-token-resp.json);
            rm -f /tmp/service-token-resp.json;
            if [ -z "$${SERVICE_TOKEN_VALUE}" ]; then
              echo "ERROR: Fleet Server service token value missing from creation response.";
              exit 1;
            fi;
            printf "%s" "$${SERVICE_TOKEN_VALUE}" > "$${TOKEN_FILE}";
            chmod 600 "$${TOKEN_FILE}";
            echo "Fleet Server service token created.";
          elif [ "$${SERVICE_TOKEN_CODE}" = "409" ]; then
            echo "Fleet Server service token already exists in Elasticsearch but file is missing. Rotating token.";
            curl -s -o /dev/null -X DELETE --cacert config/certs/ca/ca.crt -u "$${ADMIN_USER}:$${ADMIN_PASS}" "https://ecp-elasticsearch:9200/_security/service/elastic/fleet-server/credential/token/fleet-server-token";
            SERVICE_TOKEN_RESPONSE=$(curl -s -o /tmp/service-token-resp.json -w "%{http_code}" -X POST --cacert config/certs/ca/ca.crt -u "$${ADMIN_USER}:$${ADMIN_PASS}" -H "Content-Type: application/json" "https://ecp-elasticsearch:9200/_security/service/elastic/fleet-server/credential/token/fleet-server-token");
            if [ "$${SERVICE_TOKEN_RESPONSE}" != "200" ]; then
              echo "ERROR: Failed to recreate Fleet Server service token (HTTP $${SERVICE_TOKEN_RESPONSE}).";
              exit 1;
            fi;
            SERVICE_TOKEN_VALUE=$(sed -n "s/.*\"token\":{[^}]*\"value\":\"\([^\"]*\)\".*/\1/p" /tmp/service-token-resp.json);
            rm -f /tmp/service-token-resp.json;
            if [ -z "$${SERVICE_TOKEN_VALUE}" ]; then
              echo "ERROR: Fleet Server service token value missing from recreation response.";
              exit 1;
            fi;
            printf "%s" "$${SERVICE_TOKEN_VALUE}" > "$${TOKEN_FILE}";
            chmod 600 "$${TOKEN_FILE}";
            echo "Fleet Server service token recreated.";
          else
            echo "ERROR: Unexpected response creating Fleet Server service token (HTTP $${SERVICE_TOKEN_CODE}).";
            echo "Check that the Elasticsearch admin credentials used by the setup container are still valid.";
            exit 1;
          fi;
        fi;
        echo "Fleet Server service token ready.";
        chmod 600 config/certs/.admin_creds config/fleet-certs/service-token;
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/elasticsearch/elasticsearch.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  elasticsearch:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: ecp-elasticsearch
    volumes:
      - certs:/usr/share/elasticsearch/config/certs:ro
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    restart: always
    environment:
      - node.name=ecp-elasticsearch
      - cluster.name=${CLUSTER_NAME}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - xpack.security.enabled=true
      # NOTE: xpack.security.audit.* is intentionally NOT set. The BASIC license
      # does not permit security audit logging (ES logs a warning and ignores it).
      # See README "Auditability" for what is traceable on this license.
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.chain.pem
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.http.ssl.verification_mode=certificate
      - xpack.security.http.ssl.client_authentication=optional
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.client_authentication=optional
      - xpack.license.self_generated.type=${LICENSE}
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    depends_on:
      setup:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: ecp-kibana
    volumes:
      - kibana-certs:/usr/share/kibana/config/certs:z,ro
      - kibanadata:/usr/share/kibana/data
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml:Z,ro
    ports:
      - ${KIBANA_PORT}:5601
    restart: always
    environment:
      - SERVER_NAME=ecp-kibana
      - ELASTICSEARCH_HOSTS=https://ecp-elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${KIBANA_USERNAME:-kibana_system}
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=config/certs/kibana/kibana.crt
      - SERVER_SSL_KEY=config/certs/kibana/kibana.key
      - SERVER_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - KIBANA_ENCRYPTION_KEY=${KIBANA_ENCRYPTION_KEY}
    mem_limit: ${MEM_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -I -s --cacert config/certs/ca/ca.crt https://localhost:5601 | grep -q 'HTTP/2 302'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  fleet-server:
      depends_on:
        setup:
          condition: service_completed_successfully
        kibana:
          condition: service_healthy
        elasticsearch:
          condition: service_healthy
      image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION}
      container_name: ecp-fleet-server
      entrypoint: ["/fleet-entrypoint.sh"]
      volumes:
        - ./fleet-entrypoint.sh:/fleet-entrypoint.sh:ro
        - fleet-certs:/certs:ro
        - fleetserverdata:/usr/share/elastic-agent
      ports:
        - ${FLEET_PORT}:8220
      restart: always
      user: root
      environment:
        - FLEET_ENROLL=1
        - FLEET_SERVER_POLICY_ID=fleet-server-policy
        - FLEET_SERVER_ENABLE=1
        - KIBANA_FLEET_SETUP=1
        - KIBANA_HOST=https://ecp-kibana:5601
        - FLEET_URL=https://ecp-fleet-server:8220
        - FLEET_SERVER_ELASTICSEARCH_HOST=https://ecp-elasticsearch:9200
        - FLEET_CA=/certs/ca/ca.crt
        - FLEET_SERVER_CERT=/certs/fleet-server/fleet-server.crt
        - FLEET_SERVER_CERT_KEY=/certs/fleet-server/fleet-server.key
        - FLEET_SERVER_SERVICE_TOKEN_PATH=/certs/service-token
        - FLEET_SERVER_ELASTICSEARCH_CA=/certs/ca/ca.crt
        - KIBANA_FLEET_USERNAME=${ELASTIC_USERNAME:-elastic}
        - KIBANA_FLEET_PASSWORD=${ELASTIC_PASSWORD}
        - KIBANA_FLEET_CA=/certs/ca/ca.crt

volumes:
  certs:
    driver: local
  fleet-certs:
    driver: local
  kibana-certs:
    driver: local
  esdata01:
    driver: local
  kibanadata:
    driver: local
  fleetserverdata:
    driver: local
