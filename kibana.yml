xpack.encryptedSavedObjects.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"
server.host: "0.0.0.0"
telemetry.enabled: "false"
xpack.fleet.packages:
  # Versions pinned to the values verified working in this deployment
  # (STACK_VERSION 9.5.0) instead of floating "latest" tags.
  - name: fleet_server
    version: 1.6.1
  - name: system
    version: 2.22.4
xpack.fleet.agentPolicies:
  - name: Fleet-Server-Policy
    id: fleet-server-policy
    namespace: default
    package_policies:
      - name: fleet_server-1
        package:
          name: fleet_server
# Fleet default Elasticsearch output and Fleet Server host.
# KIBANA_FLEET_SETUP=1 seeds these on first boot; without this, Kibana falls
# back to http://localhost:9200, which makes every agent's monitoring output
# fail with connection-refused and Fleet Server show up as degraded/unhealthy.
# ${SIEM_IP} and ${CA_FINGERPRINT} come from .env and are passed into the
# container by docker-compose.yml; Kibana's config loader substitutes them at
# boot (and throws on unknown variables).
# CA_FINGERPRINT = SHA-256 of the deployment CA. The CA (ca.crt) is generated
# once by the setup container into the "certs" docker volume. The exact
# fingerprint command is documented next to CA_FINGERPRINT in .env – recompute
# it there whenever certificates are regenerated, then run:
#   docker compose up -d --no-deps kibana

xpack.fleet.agents.elasticsearch.hosts: ["https://${SIEM_IP}:9200"]
xpack.fleet.agents.elasticsearch.ca_trusted_fingerprint: "${CA_FINGERPRINT}"
xpack.fleet.agents.fleet_server.hosts: ["https://${SIEM_IP}:8220"]


